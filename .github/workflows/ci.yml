name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: 'E2E: build, plan, install, idempotency'
        run: |
          set -euo pipefail

          bun build src/cli.ts --compile --outfile=bin/gearup
          ./bin/gearup --help

          # Inline e2e fixture: one brew install + one shell step (with a
          # check command that flips after the install runs).
          MARKER=/tmp/gearup-e2e-marker
          rm -f "$MARKER"
          cat > /tmp/ci-e2e.jsonc <<EOF
          {
            "version": 1,
            "name": "ci-e2e",
            "steps": {
              "hello": { "type": "brew", "formula": "hello" },
              "marker": {
                "type": "shell",
                "check": "test -f $MARKER",
                "install": "touch $MARKER"
              }
            }
          }
          EOF

          # 1. plan against a fresh runner — expect exit 10 (steps pending).
          EXIT=0
          ./bin/gearup plan --config /tmp/ci-e2e.jsonc || EXIT=$?
          if [ "$EXIT" != "10" ]; then
            echo "expected plan exit 10 (steps pending), got $EXIT" >&2
            exit 1
          fi

          # 2. run — performs real installs.
          ./bin/gearup run --config /tmp/ci-e2e.jsonc

          # 3. confirm side effects landed.
          brew list --formula hello
          test -f "$MARKER"

          # 4. plan again — expect exit 0 (idempotent: machine up to date).
          EXIT=0
          ./bin/gearup plan --config /tmp/ci-e2e.jsonc || EXIT=$?
          if [ "$EXIT" != "0" ]; then
            echo "expected plan exit 0 (up to date), got $EXIT" >&2
            exit 1
          fi
